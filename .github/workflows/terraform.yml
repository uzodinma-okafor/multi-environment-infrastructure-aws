name: Terraform Validate & Format Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

 - name: Configure AWS Credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: echo "AWS credentials configured"
        
      - name: Terraform Init (Root)
        run: cd terraform && terraform init

      - name: Terraform Format Check (Root)
        run: cd terraform && terraform fmt -check

      - name: Terraform Validate (Root)
        run: cd terraform && terraform validate

      - name: Terraform Init (Dev Environment)
        run: cd terraform/environments/dev && terraform init

      - name: Terraform Format Check (Dev Environment)
        run: cd terraform/environments/dev && terraform fmt -check

      - name: Terraform Validate (Dev Environment)
        run: cd terraform/environments/dev && terraform validate